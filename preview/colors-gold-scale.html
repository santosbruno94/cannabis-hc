<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="tag">Gold accent — opacity ladder</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr) repeat(3,1fr);gap:8px">
  <div class="swatch" style="background:#e0be7a;color:#0f1c2e;border:1px solid rgba(15,28,46,.1)">
    <div>Gold Light</div>
    <div class="hex">#E0BE7A · italic highlight</div>
  </div>
  <div class="swatch" style="background:#c9a84c;color:#0f1c2e">
    <div>Gold</div>
    <div class="hex" style="opacity:.85">#C9A84C · accent base</div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,0.30);border:1px solid rgba(201,168,76,.45);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#f5f0e8;text-align:center">.30<br><span style="opacity:.6">soft</span></div>
  <div style="display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,.3);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#f5f0e8;text-align:center">.15<br><span style="opacity:.6">hairline</span></div>
  <div style="display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,.12);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#f5f0e8;text-align:center">.05<br><span style="opacity:.6">faint</span></div>
</div>
<div style="height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),transparent);margin:14px 0 10px"></div>
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a8b5c4;line-height:1.7">
  Hairlines, eyebrow rules, button fills, numerals — all gold. <span style="color:#e0be7a">No second accent.</span>
</div>
</body></html>
