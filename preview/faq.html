<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div style="display:flex;flex-direction:column;gap:0;border:1px solid rgba(201,168,76,.15)">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(201,168,76,.12)">
    <span style="font-family:'Fraunces',serif;font-size:14px;color:#f5f0e8">É preciso ter receita médica?</span>
    <span style="color:#c9a84c;font-size:16px">+</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;border-bottom:1px solid rgba(201,168,76,.12);background:rgba(201,168,76,.03)">
    <div>
      <div style="font-family:'Fraunces',serif;font-size:14px;color:#f5f0e8;margin-bottom:6px">Quanto tempo demora o processo?</div>
      <div style="font-size:11px;color:#a8b5c4;line-height:1.6;font-weight:300">Em média de 30 a 90 dias, dependendo do tribunal.</div>
    </div>
    <span style="color:#c9a84c;font-size:16px;transform:rotate(45deg);display:inline-block">+</span>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px">
    <span style="font-family:'Fraunces',serif;font-size:14px;color:#f5f0e8">Posso cultivar para outros pacientes?</span>
    <span style="color:#c9a84c;font-size:16px">+</span>
  </div>
</div>
</body></html>
