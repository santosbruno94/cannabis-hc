<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="tag">Navy surfaces — section rhythm</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
  <div class="swatch" style="background:#09121e;color:#f5f0e8;border:1px solid rgba(201,168,76,.2)">
    <div>Navy Deep</div>
    <div class="hex">#09121E</div>
    <div class="hex" style="margin-top:4px;opacity:.55">footer</div>
  </div>
  <div class="swatch" style="background:#0f1c2e;color:#f5f0e8">
    <div>Navy</div>
    <div class="hex">#0F1C2E</div>
    <div class="hex" style="margin-top:4px;opacity:.55">primary</div>
  </div>
  <div class="swatch" style="background:#162438;color:#f5f0e8">
    <div>Navy Mid</div>
    <div class="hex">#162438</div>
    <div class="hex" style="margin-top:4px;opacity:.55">alt section</div>
  </div>
  <div class="swatch" style="background:#1e3251;color:#f5f0e8">
    <div>Navy Light</div>
    <div class="hex">#1E3251</div>
    <div class="hex" style="margin-top:4px;opacity:.55">card surface</div>
  </div>
</div>
<div style="height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.3),transparent);margin:14px 0 10px"></div>
<div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a8b5c4;line-height:1.7">
  Barely-perceptible warmer alternation. <span style="color:#c9a84c">No gradients.</span> No image-as-background.
</div>
</body></html>
