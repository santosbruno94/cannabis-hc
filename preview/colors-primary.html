<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head><body>
<div class="tag">Brand palette · navy + gold + cream</div>
<div style="display:grid;grid-template-columns:repeat(3, 1fr) 1fr;gap:10px">
  <div class="swatch" style="background:#0f1c2e;color:#f5f0e8">
    <div>Navy</div>
    <div class="hex">#0F1C2E · primary surface</div>
  </div>
  <div class="swatch" style="background:#c9a84c;color:#0f1c2e">
    <div>Gold</div>
    <div class="hex" style="opacity:.85">#C9A84C · single accent</div>
  </div>
  <div class="swatch" style="background:#f5f0e8;color:#0f1c2e">
    <div>Cream</div>
    <div class="hex" style="opacity:.7">#F5F0E8 · text on navy</div>
  </div>
  <div class="swatch" style="background:#2d4a3e;color:#f5f0e8;border:1px solid rgba(201,168,76,.25)">
    <div>Green <span style="font-size:9px;font-weight:400;opacity:.7">(CTA only)</span></div>
    <div class="hex">#2D4A3E · used once</div>
  </div>
</div>
<div class="hairline" style="margin:14px 0 12px"></div>
<div style="display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a8b5c4">
  <span><span style="color:#c9a84c">2-color</span> brand</span>
  <span>cream typography</span>
  <span>green is exception</span>
</div>
</body></html>
